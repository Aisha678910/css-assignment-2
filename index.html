<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="product-card">
    <div class="grey"></div>
    <div class="orange">
    <div class="shoe">
    <img src="https://i.pinimg.com/originals/51/2b/4b/512b4b870390fac58da5206e88d228d6.png" alt="shoes">
    </div>
    <div class="arrow-icon">
    <i class="fa-solid fa-arrow-left-long"></i>
    <i class="fa-solid fa-arrow-right-long"></i>
    </div>
    </div>
    <div class="content">
    <div class="header">
            <h2>Airmax</h2>
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-user"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
    </div>
            <p class="collection">Winter Collection</p>
            <h1 class="Sneakers">Men Black Sneakers</h1>
            <div class="price"><span>$150</span><del>$200</del></div>
            <p class="size-row">SIZE :</p>
            <div class="sizes-no">
                <span>7</span>
                <span>8</span>
                <span>9</span>
                <span>10</span>
                <span>11</span>
            </div>
    </div>
            <p class="color-row">COLOR:</p>
            <div class="color-option">
<i class="fa-solid fa-circle"></i>
<i class="fa-solid fa-circle"></i>
<i class="fa-solid fa-circle"></i></div>
    </div>
    <div class="actions">
    <button class="bag-icon">
        <i class="fa-solid fa-bag-shopping"></i>Buy Now</button>
    <button class="cart-icon">
         <i class="fa-solid fa-cart-shopping"></i> Add To Cart</button>
</div>
    </div>
</div>
</body>
</html>
